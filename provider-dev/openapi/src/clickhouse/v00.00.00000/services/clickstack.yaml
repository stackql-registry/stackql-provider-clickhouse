    ClickStackNumberFormat:
      properties:
        output:
          description: Output format applied to the number.
          type: string
          enum:
            - currency
            - percent
            - byte
            - time
            - number
            - data_rate
            - throughput
            - duration
          example: number
        mantissa:
          description: Number of decimal places.
          type: integer
          example: 2
        thousandSeparated:
          description: Whether to use thousand separators.
          type: boolean
          example: true
        average:
          description: Whether to show as average.
          type: boolean
          example: false
        decimalBytes:
          description: Use decimal bytes (1000) vs binary bytes (1024).
          type: boolean
          example: false
        factor:
          description: Multiplication factor.
          type: number
          example: 1
        currencySymbol:
          description: Currency symbol for currency format.
          type: string
          example: $
        numericUnit:
          description: Numeric unit for data, data rate, or throughput formats.
          type: string
          enum:
            - bytes_iec
            - bytes_si
            - bits_iec
            - bits_si
            - kibibytes
            - kilobytes
            - mebibytes
            - megabytes
            - gibibytes
            - gigabytes
            - tebibytes
            - terabytes
            - pebibytes
            - petabytes
            - packets_sec
            - bytes_sec_iec
            - bytes_sec_si
            - bits_sec_iec
            - bits_sec_si
            - kibibytes_sec
            - kibibits_sec
            - kilobytes_sec
            - kilobits_sec
            - mebibytes_sec
            - mebibits_sec
            - megabytes_sec
            - megabits_sec
            - gibibytes_sec
            - gibibits_sec
            - gigabytes_sec
            - gigabits_sec
            - tebibytes_sec
            - tebibits_sec
            - terabytes_sec
            - terabits_sec
            - pebibytes_sec
            - pebibits_sec
            - petabytes_sec
            - petabits_sec
            - cps
            - ops
            - rps
            - reads_sec
            - wps
            - iops
            - cpm
            - opm
            - rpm_reads
            - wpm
          example: bytes_iec
        unit:
          description: Custom unit label.
          type: string
          example: ms
      type: object
    ClickStackSelectItem:
      properties:
        aggFn:
          description: >-
            Aggregation function to apply. "count" does not require a
            valueExpression; "quantile" requires a level field indicating the
            desired percentile (e.g., 0.95).
          type: string
          enum:
            - avg
            - count
            - count_distinct
            - last_value
            - max
            - min
            - quantile
            - sum
            - any
            - none
          example: count
        valueExpression:
          description: >-
            Expression for the column or value to aggregate. Must be omitted
            when aggFn is "count"; required for all other aggFn values.
          type: string
          example: Duration
        alias:
          description: Display alias for this select item in chart legends.
          type: string
          example: Request Duration
        level:
          description: Percentile level; only valid when aggFn is "quantile".
          type: number
          enum:
            - '0.5'
            - '0.9'
            - '0.95'
            - '0.99'
        where:
          description: SQL or Lucene filter condition applied before aggregation.
          type: string
          example: service:api
        whereLanguage:
          description: Query language for the where clause.
          type: string
          enum:
            - sql
            - lucene
        metricName:
          description: >-
            Name of the metric to aggregate; only applicable when the source is
            a metrics source.
          type: string
          example: http.server.duration
        metricType:
          description: Metric type; only applicable when the source is a metrics source.
          type: string
          enum:
            - sum
            - gauge
            - histogram
            - summary
            - exponential histogram
        periodAggFn:
          description: >-
            Optional period aggregation function for Gauge metrics (e.g.,
            compute the delta over the period).
          type: string
          enum:
            - delta
          example: delta
        numberFormat:
          $ref: '#/components/schemas/ClickStackNumberFormat'
      required:
        - aggFn
      type: object
